<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargador de Audio Robusto - Web Audio API</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .file-input-wrapper {
      margin-bottom: 1.5rem;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: #00e676;
      color: #121212;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #00c853;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      background: #424242;
      color: #9e9e9e;
      cursor: not-allowed;
    }

    .status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #b0bec5;
      min-height: 1.5em;
      word-break: break-word;
    }

    .status.error {
      color: #ff5252;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Cargador de Audio</h2>
    
    <div class="file-input-wrapper">
      <button class="btn" id="selectBtn">Seleccionar Archivo</button>
      <input type="file" id="audioInput" accept="audio/*,.wav,.mp3,.ogg,.flac,.m4a">
    </div>

    <div class="controls">
      <button class="btn" id="playBtn" disabled>Reproducir</button>
      <button class="btn" id="stopBtn" disabled>Detener</button>
    </div>

    <div class="status" id="statusText">Esperando archivo...</div>
  </div>

  <script>
    // 1. Inicialización perezosa del AudioContext
    let audioCtx = null;
    let currentSourceNode = null;
    let loadedAudioBuffer = null;

    // Elementos del DOM
    const audioInput = document.getElementById('audioInput');
    const selectBtn = document.getElementById('selectBtn');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('statusText');

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      return audioCtx;
    }

    // Modalidad de selección mediante botón genérico
    selectBtn.addEventListener('click', () => audioInput.click());

    // 2. Manejo de selección de archivo
    audioInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      setStatus(`Cargando: ${file.name}...`);
      disableControls();

      try {
        const ctx = getAudioContext();

        // 3. Reanudar contexto si el navegador lo suspendió
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }

        // 4. Lectura de archivo mediante FileReader promisificado
        const arrayBuffer = await readFileAsArrayBuffer(file);

        // 5. Decodificación segura y compatible
        // Usamos .slice(0) para prevenir el desprendimiento (detached ArrayBuffer)
        loadedAudioBuffer = await decodeAudioDataSafely(ctx, arrayBuffer.slice(0));

        setStatus(`Listo: ${file.name} (${loadedAudioBuffer.duration.toFixed(1)}s)`);
        playBtn.disabled = false;

      } catch (err) {
        console.error("Error procesando audio:", err);
        setStatus(`Error: ${err.message || "No se pudo procesar el archivo"}`, true);
        loadedAudioBuffer = null;
      } finally {
        // 6. Resetear el valor del input para permitir recargar el mismo archivo consecutivamente
        audioInput.value = '';
      }
    });

    // 7. Reproducción de Audio
    playBtn.addEventListener('click', async () => {
      if (!loadedAudioBuffer) return;

      const ctx = getAudioContext();

      if (ctx.state === 'suspended') {
        await ctx.resume();
      }

      // Detener cualquier reproducción previa
      stopCurrentAudio();

      // Crear nuevo nodo fuente (los BufferSourceNodes son de único uso)
      currentSourceNode = ctx.createBufferSource();
      currentSourceNode.buffer = loadedAudioBuffer;
      currentSourceNode.connect(ctx.destination);

      currentSourceNode.onended = () => {
        playBtn.disabled = false;
        stopBtn.disabled = true;
      };

      currentSourceNode.start(0);
      playBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus("Reproduciendo...");
    });

    // 8. Detener reproducción
    stopBtn.addEventListener('click', () => {
      stopCurrentAudio();
      setStatus("Reproducción detenida.");
    });

    function stopCurrentAudio() {
      if (currentSourceNode) {
        try {
          currentSourceNode.stop();
          currentSourceNode.disconnect();
        } catch (e) {
          // Ya estaba detenido
        }
        currentSourceNode = null;
      }
      playBtn.disabled = !loadedAudioBuffer;
      stopBtn.disabled = true;
    }

    // --- FUNCIONES AUXILIARES ROBUSTAS ---

    function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = () => reject(new Error("Error de lectura del archivo local."));
        reader.readAsArrayBuffer(file);
      });
    }

    function decodeAudioDataSafely(ctx, arrayBuffer) {
      return new Promise((resolve, reject) => {
        // Fallback dual: Promesas + Callbacks (cubre Safari legacy y browsers modernos)
        const res = ctx.decodeAudioData(
          arrayBuffer,
          (buffer) => resolve(buffer),
          (err) => reject(new Error("Formato de audio no soportado o archivo corrupto."))
        );

        if (res && typeof res.then === 'function') {
          res.then(resolve).catch((err) => reject(new Error("Error al decodificar audio.")));
        }
      });
    }

    function setStatus(message, isError = false) {
      statusText.textContent = message;
      statusText.classList.toggle('error', isError);
    }

    function disableControls() {
      playBtn.disabled = true;
      stopBtn.disabled = true;
    }
  </script>
</body>
</html>
